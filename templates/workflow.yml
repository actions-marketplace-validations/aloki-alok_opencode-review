# Copy to .github/workflows/opencode-review.yml and add an OPENROUTER_API_KEY secret.
name: OpenCode review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # branches: [main]   # limit to PRs into these branches
  # Comments run from the default branch with secrets. Safe here: the action's code comes from its
  # pinned ref, it checks the commenter is a member, refuses fork PRs, and the model can only read.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

# A new push cancels the review of the old commit. Questions each get their own run, so a
# comment never cancels an answer in progress.
concurrency:
  group: >-
    opencode-review-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opencode:
    # Only commands take a runner. The action checks every gate again.
    if: github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/oc ')
    runs-on: ubuntu-latest # or a dedicated self-hosted label, so reviews don't queue behind builds
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: aloki-alok/opencode-review@v0 # or pin a full commit SHA
        with:
          model: openrouter/deepseek/deepseek-v4.1-flash
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
